<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Dashboard Areas</title>
<style>
.layout { display: grid; grid-template-columns: 200px 1fr; grid-template-areas: "header header" "sidebar main" "footer footer"; gap: 10px; }
header { grid-area: header; } aside { grid-area: sidebar; } main { grid-area: main; } footer { grid-area: footer; }
.layout > * { background: #e2e8f0; padding: 20px; }
</style></head><body><div class="layout">
<header>Header</header><aside>Sidebar</aside><main>Main content</main><footer>Footer</footer>
</div></body></html>
